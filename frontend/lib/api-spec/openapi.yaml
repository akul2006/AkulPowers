openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: grid
    description: Micro-grid monitoring operations
  - name: nodes
    description: Micro-grid node management
  - name: trading
    description: Peer-to-peer energy trading
  - name: audit
    description: Transaction audit history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /grid/summary:
    get:
      operationId: getGridSummary
      tags:
        - grid
      summary: Get live grid summary
      responses:
        "200":
          description: Current grid telemetry and recent generation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridSummary"
  /nodes:
    get:
      operationId: getNodes
      tags:
        - nodes
      summary: List micro-grid nodes
      responses:
        "200":
          description: Registered nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GridNode"
    post:
      operationId: createNode
      tags:
        - nodes
      summary: Register a micro-grid node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeInput"
      responses:
        "201":
          description: Registered node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridNode"
        "400":
          description: Invalid node payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trades:
    post:
      operationId: createTrade
      tags:
        - trading
      summary: Request an energy trade from the Java backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Committed trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Backend rejection; trade contains the recorded result when available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Backend error; recorded trade result included when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /audit-logs:
    get:
      operationId: getAuditLogs
      tags:
        - audit
      summary: Get recent transaction audit logs
      responses:
        "200":
          description: Recent audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GridSummary:
      type: object
      properties:
        totalGenerationKw:
          type: number
        totalConsumptionKw:
          type: number
        netReserveKw:
          type: number
          description: Backend-calculated total generation minus consumption, in kW.
        activeNodes:
          type: integer
        currentPrice:
          type: number
          description: Authoritative INR per kWh.
        systemStatus:
          type: string
          enum:
            - STABLE
            - WARNING
            - LOAD SHEDDING ACTIVE
        generatedToday:
          type: number
        consumedToday:
          type: number
        renewableShare:
          type: number
        pricing:
          $ref: "#/components/schemas/PricingBreakdown"
        history:
          type: array
          items:
            $ref: "#/components/schemas/GridHistoryPoint"
      required:
        - totalGenerationKw
        - totalConsumptionKw
        - netReserveKw
        - activeNodes
        - currentPrice
        - systemStatus
        - generatedToday
        - consumedToday
        - renewableShare
        - pricing
        - history
    PricingBreakdown:
      type: object
      properties:
        baseRate:
          type: number
        supplyDemandFactor:
          type: number
        peakHourFactor:
          type: number
        weatherFactor:
          type: number
        explanation:
          type: string
      required:
        - baseRate
        - supplyDemandFactor
        - peakHourFactor
        - weatherFactor
        - explanation
    GridHistoryPoint:
      type: object
      properties:
        time:
          type: string
        generation:
          type: number
        consumption:
          type: number
      required:
        - time
        - generation
        - consumption
    GridNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - SOLAR_PRODUCER
            - CONSUMER
            - EV_STATION
            - BATTERY_STORAGE
        location:
          type: string
          minLength: 1
        capacity:
          type: number
          minimum: 0
          description: Maximum stored energy capacity in kWh.
        priority:
          type: integer
          minimum: 1
          maximum: 4
        availableEnergyKwh:
          type: number
        currentOutputKw:
          type: number
          description: Positive generation, negative consumption in kW.
        balance:
          type: number
          description: Account balance in INR.
        status:
          type: string
          enum:
            - ONLINE
            - OFFLINE
            - THROTTLED
        lastSeen:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - location
        - capacity
        - priority
        - currentOutputKw
        - balance
        - status
        - lastSeen
    NodeInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - SOLAR_PRODUCER
            - CONSUMER
            - EV_STATION
            - BATTERY_STORAGE
        location:
          type: string
          minLength: 1
        capacity:
          type: number
          minimum: 0
          description: Maximum stored energy capacity in kWh.
        priority:
          type: integer
          minimum: 1
          maximum: 4
      required:
        - name
        - type
        - location
        - capacity
        - priority
    TradeInput:
      type: object
      properties:
        sellerNodeId:
          type: string
          minLength: 1
        buyerNodeId:
          type: string
          minLength: 1
        energyAmount:
          type: number
          exclusiveMinimum: 0
      required:
        - sellerNodeId
        - buyerNodeId
        - energyAmount
    TradeResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - COMMITTED
            - ROLLED_BACK
            - FAILED
        sellerNodeId:
          type: string
        buyerNodeId:
          type: string
        energyAmount:
          type: number
        pricePerKwh:
          type: number
        totalCost:
          type: number
        settledAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - id
        - status
        - sellerNodeId
        - buyerNodeId
        - energyAmount
        - settledAt
        - message
    AuditLog:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - P2P_ENERGY_TRADE
            - SYSTEM
            - ALERT
            - NODE_REGISTERED
            - LOAD_SHEDDING
        message:
          type: string
        status:
          type: string
          enum:
            - COMMITTED
            - ROLLED_BACK
            - FAILED
            - SUCCESS
        sellerNodeId:
          type: string
        buyerNodeId:
          type: string
        energyAmount:
          type: number
        pricePerKwh:
          type: number
        totalCost:
          type: number
      required:
        - id
        - timestamp
        - type
        - message
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        trade:
          $ref: "#/components/schemas/TradeResult"
      required:
        - error
        - code
