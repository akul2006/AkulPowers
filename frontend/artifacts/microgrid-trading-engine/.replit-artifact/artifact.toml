kind = "web"
previewPath = "/"
title = "Smart Micro-Grid Trading Engine"
description = "A responsive operations dashboard for monitoring renewable micro-grid nodes, executing peer-to-peer energy trades, viewing dynamic pricing, and auditing ACID transaction activity."
version = "1.0.0"
id = "artifacts/microgrid-trading-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21381

[services.development]
run = "pnpm --filter @workspace/microgrid-trading-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/microgrid-trading-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/microgrid-trading-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21381"
BASE_PATH = "/"
